name: CI

on:
  push:
    branches:
      - main
    tags:
      - source-*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift and app validation
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Calculate build parallelism
        shell: bash
        run: |
          jobs=$(( $(sysctl -n hw.ncpu) - 1 ))
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          echo "SWIFT_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"

      - name: Run Swift tests
        run: swift test --jobs "$SWIFT_BUILD_JOBS"

      - name: Test Wine source synchronization
        run: Tests/Shell/ensure_switchyard_wine_test.sh

      - name: Test bundled Wine source policy
        run: Tests/Shell/bundle_wine_source_policy_test.sh

      - name: Test bundled GPTK component policy
        run: Tests/Shell/bundle_gptk_component_policy_test.sh

      - name: Validate release packaging script
        run: |
          bash -n script/build_and_run.sh
          bash -n script/sign_sparkle_framework.sh
          bash -n script/create_dmg.sh
          bash -n script/generate_appcast.sh
          bash -n script/release_app.sh

      - name: Test DMG assembly
        run: Tests/Shell/create_dmg_test.sh

      - name: Test signed appcast generation
        run: Tests/Shell/generate_appcast_test.sh

      - name: Test local code-signing identity selection
        run: Tests/Shell/local_codesign_identity_test.sh

      - name: Test runner lifecycle and logging
        run: Tests/Shell/runner_prefix_session_test.sh

      - name: Test runner protocol, shortcut, and partial-log handling
        shell: bash
        run: |
          set -euo pipefail
          swift build --product switchyard-runner --jobs "$SWIFT_BUILD_JOBS"
          swift build --product switchyard-url-handler --jobs "$SWIFT_BUILD_JOBS"
          swift build --product switchyard-shortcut-handler --jobs "$SWIFT_BUILD_JOBS"
          bin_path="$(swift build --show-bin-path)"
          runner_path="$bin_path/switchyard-runner"
          url_handler_path="$bin_path/switchyard-url-handler"
          shortcut_handler_path="$bin_path/switchyard-shortcut-handler"
          SWITCHYARD_URL_HANDLER_PATH="$url_handler_path" Tests/Shell/url_handler_batch_delivery_test.sh
          SWITCHYARD_RUNNER_PATH="$runner_path" Tests/Shell/runner_protocol_callback_test.sh
          SWITCHYARD_RUNNER_PATH="$runner_path" Tests/Shell/runner_desktop_shortcut_test.sh
          SWITCHYARD_RUNNER_PATH="$runner_path" \
            SWITCHYARD_SHORTCUT_HANDLER_PATH="$shortcut_handler_path" \
            Tests/Shell/prefix_lock_deadline_test.sh
          SWITCHYARD_RUNNER="$runner_path" Tests/Shell/runner_partial_log_buffer_test.sh

      - name: Verify app bundle
        env:
          SWITCHYARD_SKIP_RUNTIME_ENSURE: "1"
        run: ./script/build_and_run.sh --verify
