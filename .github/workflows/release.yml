name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v0.4.0
        required: true
        type: string
      validate_only:
        description: Validate release source and credentials without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  validate:
    name: Validate release source
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      commit_sha: ${{ steps.release_input.outputs.commit_sha }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate immutable release input
        id: release_input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable semantic version such as v0.4.0" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag must point to a commit on origin/main" >&2
            exit 1
          fi
          latest_stable_tag=""
          while IFS= read -r candidate_tag; do
            if [[ "$candidate_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_stable_tag="$candidate_tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          if [ "$latest_stable_tag" != "$RELEASE_TAG" ]; then
            echo "release tag must be the newest stable tag: $latest_stable_tag" >&2
            exit 1
          fi
          echo "commit_sha=$head_commit" >> "$GITHUB_OUTPUT"

      - name: Calculate build parallelism
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(( $(sysctl -n hw.ncpu) - 1 ))
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          echo "SWIFT_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"

      - name: Run release validation
        shell: bash
        run: |
          set -euo pipefail
          swift package resolve
          swift test --jobs "$SWIFT_BUILD_JOBS"
          Tests/Shell/create_dmg_test.sh
          Tests/Shell/generate_appcast_test.sh
          swift build --product switchyard-runner --jobs "$SWIFT_BUILD_JOBS"
          swift build --product switchyard-url-handler --jobs "$SWIFT_BUILD_JOBS"
          bin_path="$(swift build --show-bin-path)"
          runner_path="$bin_path/switchyard-runner"
          url_handler_path="$bin_path/switchyard-url-handler"
          SWITCHYARD_URL_HANDLER_PATH="$url_handler_path" Tests/Shell/url_handler_batch_delivery_test.sh
          SWITCHYARD_RUNNER_PATH="$runner_path" Tests/Shell/runner_protocol_callback_test.sh
          SWITCHYARD_RUNNER_PATH="$runner_path" Tests/Shell/runner_desktop_shortcut_test.sh
          SWITCHYARD_RUNNER="$runner_path" Tests/Shell/runner_partial_log_buffer_test.sh
          Tests/Shell/release_workflow_credential_order_test.sh
          for script in \
            script/build_and_run.sh \
            script/sign_sparkle_framework.sh \
            script/create_dmg.sh \
            script/generate_appcast.sh \
            script/release_app.sh; do
            bash -n "$script"
          done

  release:
    name: Sign, notarize, and publish
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NOTARY_PROFILE: switchyard-ci-notary

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Revalidate release tag and commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable semantic version such as v0.4.0" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$head_commit" != "$EXPECTED_COMMIT" ]; then
            echo "release tag changed after source validation" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag must point to a commit on origin/main" >&2
            exit 1
          fi
          latest_stable_tag=""
          while IFS= read -r candidate_tag; do
            if [[ "$candidate_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_stable_tag="$candidate_tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          if [ "$latest_stable_tag" != "$RELEASE_TAG" ]; then
            echo "release tag must be the newest stable tag: $latest_stable_tag" >&2
            exit 1
          fi
          if [ "$VALIDATE_ONLY" != "true" ] \
            && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Calculate build metadata
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(( $(sysctl -n hw.ncpu) - 1 ))
          if [ "$jobs" -lt 1 ]; then jobs=1; fi
          app_version="${RELEASE_TAG#v}"
          app_build="$(git rev-list --count HEAD)"
          {
            echo "SWIFT_BUILD_JOBS=$jobs"
            echo "SWITCHYARD_APP_VERSION=$app_version"
            echo "SWITCHYARD_APP_BUILD=$app_build"
            echo "RELEASE_OUTPUT=$RUNNER_TEMP/switchyard-release"
            echo "RELEASE_NOTES=$RUNNER_TEMP/switchyard-release-notes.md"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/switchyard-release.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Build release app without release credentials
        shell: bash
        env:
          SWITCHYARD_BUILD_CONFIGURATION: release
          SWITCHYARD_CODESIGN_IDENTITY: "-"
          SWITCHYARD_ENABLE_APP_UPDATES: "1"
          SWITCHYARD_SKIP_RUNTIME_ENSURE: "1"
        run: ./script/build_and_run.sh --verify

      - name: Import Developer ID and notarization credentials
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            NOTARY_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            if [ -z "${!required:-}" ]; then
              echo "missing required release secret: $required" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          cleanup_raw_apple_credentials() {
            rm -f "$certificate_path" "$notary_key_path"
          }
          trap cleanup_raw_apple_credentials EXIT

          keychain_password="$(uuidgen)-$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          unset CERTIFICATE_BASE64
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$certificate_path"
          unset CERTIFICATE_PASSWORD
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          identity="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity was not imported" >&2
            exit 1
          fi
          {
            echo "RELEASE_CODESIGN_IDENTITY=$identity"
            echo "SWITCHYARD_CODESIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
          unset NOTARY_KEY_BASE64
          chmod 600 "$notary_key_path"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH" \
            --validate
          rm -f "$notary_key_path"
          unset NOTARY_KEY_ID NOTARY_ISSUER_ID
          trap - EXIT

      - name: Validate Sparkle signing credential
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "missing required release secret: SPARKLE_ED_PRIVATE_KEY" >&2
            exit 1
          fi

          sparkle_tool=".build/artifacts/sparkle/Sparkle/bin/generate_keys"
          sparkle_private_key="$RUNNER_TEMP/sparkle-private-key"
          sparkle_account="dev.switchyard.Switchyard-ci-validation"
          expected_public_key="$(
            sed -n 's/^SWITCHYARD_SPARKLE_PUBLIC_KEY=//p' config/app-update.env
          )"
          cleanup_raw_sparkle_credential() {
            rm -f "$sparkle_private_key"
          }
          trap cleanup_raw_sparkle_credential EXIT

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$sparkle_private_key"
          unset SPARKLE_ED_PRIVATE_KEY
          chmod 600 "$sparkle_private_key"
          "$sparkle_tool" \
            --account "$sparkle_account" \
            -f "$sparkle_private_key" >/dev/null
          actual_public_key="$(
            "$sparkle_tool" --account "$sparkle_account" -p
          )"
          if [ "$actual_public_key" != "$expected_public_key" ]; then
            echo "Sparkle private key does not match the configured public key" >&2
            exit 1
          fi
          rm -f "$sparkle_private_key"
          trap - EXIT

      - name: Sign and notarize release DMG
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        shell: bash
        run: |
          set -euo pipefail
          ./script/release_app.sh \
            --app dist/Switchyard.app \
            --output "$RELEASE_OUTPUT" \
            --identity "$RELEASE_CODESIGN_IDENTITY" \
            --notary-profile "$NOTARY_PROFILE" \
            --notary-keychain "$KEYCHAIN_PATH"

      - name: Generate release notes and signed appcast
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "missing required release secret: SPARKLE_ED_PRIVATE_KEY" >&2
            exit 1
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" \
            -f "target_commitish=$(git rev-parse HEAD)" \
            --jq .body > "$RELEASE_NOTES"

          dmg="$RELEASE_OUTPUT/Switchyard-${SWITCHYARD_APP_VERSION}-macos-arm64.dmg"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | ./script/generate_appcast.sh \
                --dmg "$dmg" \
                --output "$RELEASE_OUTPUT/appcast.xml" \
                --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
                --link "https://github.com/$GITHUB_REPOSITORY" \
                --release-notes "$RELEASE_NOTES"

      - name: Publish GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$RELEASE_OUTPUT/Switchyard-${SWITCHYARD_APP_VERSION}-macos-arm64.dmg"
          gh release create "$RELEASE_TAG" \
            "$dmg" \
            "$dmg.sha256" \
            "$RELEASE_OUTPUT/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Switchyard $SWITCHYARD_APP_VERSION" \
            --notes-file "$RELEASE_NOTES"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/sparkle-private-key"
